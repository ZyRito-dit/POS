name: pos_apps_umkm
description: "NexSell POS Apps UMKM - Aplikasi Kasir Modern"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # Secure Storage (token persistence)
  flutter_secure_storage: ^9.2.4

  # UI & UX
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.1
  shimmer: ^3.0.0

  # Utilities
  equatable: ^2.0.5
  freezed_annotation: 3.0.0
  json_annotation: ^4.9.0
  device_preview: 1.3.1
  flutter_svg: ^2.3.0
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: 3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Logo/logo_app_kato_pos.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/Logo/logo_app_kato_pos.png"
  windows:
    generate: true
    image_path: "assets/Logo/logo_app_kato_pos.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/Logo/
    - assets/Icons_SVG/

  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/font/Open_Sans/OpenSans-Light.ttf
          weight: 300
        - asset: assets/font/Open_Sans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/font/Open_Sans/OpenSans-Semibold.ttf
          weight: 600
        - asset: assets/font/Open_Sans/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/font/Open_Sans/OpenSans-ExtraBold.ttf
          weight: 800

    - family: Roboto Mono
      fonts:
        - asset: assets/font/Roboto_Mono/static/RobotoMono-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto_Mono/static/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto_Mono/static/RobotoMono-SemiBold.ttf
          weight: 600
        - asset: assets/font/Roboto_Mono/static/RobotoMono-Bold.ttf
          weight: 700
