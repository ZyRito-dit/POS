workflows:
  ios-workflow:
    name: iOS Build & Package (Testing / Ad-Hoc)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;
      - name: Run Flutter analyzer and unit tests
        script: |
          flutter analyze
          flutter test
      - name: Build iOS Application (Release)
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA for Testing & Sideloading
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r KatoPOS-unsigned.ipa Payload
          cd ../../..
    artifacts:
      - build/ios/iphoneos/KatoPOS-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log

  ios-release-appstore:
    name: iOS Production (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.example.posAppsUmkm"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          find ios -name "Podfile" -execdir pod install \;
      - name: Run Flutter analyzer and unit tests
        script: |
          flutter analyze
          flutter test
      - name: Set up Keychain and Apple Code Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
